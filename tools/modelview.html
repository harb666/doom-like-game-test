<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;background:#222}</style>
<script type="importmap">{ "imports": { "three": "../vendor/three/three.module.js" } }</script></head><body>
<script type="module">
import * as THREE from 'three';
import { preloadModels } from '../src/models/skinned.js';
import { buildCreature } from '../src/models/creatures.js';
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(700, 700); document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x2a2a30);
scene.add(new THREE.AmbientLight(0xffffff, 2.2));
const key = new THREE.DirectionalLight(0xfff0e0, 1.1); key.position.set(0.45, 1, 0.35); scene.add(key);
const cam = new THREE.PerspectiveCamera(22, 1, 0.01, 50);
try { await preloadModels(['ally', 'husk', 'rifter', 'spitter', 'hound', 'wraith', 'hellmaw', 'ravager', 'warden']); window.ready = true; } catch (e) { window.failed = String(e); }
window.show = (name, view, pose) => {
  const m = buildCreature(name); scene.add(m.root);
  m.update(pose, 1.2, 0.2, 0); m.root.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(m.root); const h = box.max.y - box.min.y, c = box.getCenter(new THREE.Vector3());
  const views = {
    face: [0, h * 0.925, 0.75, 0, h * 0.925, 0],
    body: [0, c.y, h * 3.2 + 1, 0, c.y, 0],
    back: [0, c.y, -(h * 3.2 + 1), 0, c.y, 0],
    side: [h * 3.2 + 1, c.y, 0, 0, c.y, 0],
    'three-quarter': [(h * 2.4 + 0.7), c.y + 0.2, (h * 2.4 + 0.7), 0, c.y, 0],
    'face3q': [0.5, h * 0.93, 0.55, 0, h * 0.925, 0],
  };
  const v = views[view] || views.body;
  cam.position.set(v[0], v[1], v[2]); cam.lookAt(v[3], v[4], v[5]);
  r.render(scene, cam);
};
</script></body></html>
